name: daily-fuel-price-update

on:
  schedule:
    # 19:00 UTC = 12:00 AM PKT (Asia/Karachi, UTC+5)
    - cron: '0 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest fuel prices
        run: node fetch-prices.js

      - name: Rebuild site (sanity check)
        run: node build.js

      - name: Run tests
        run: node test.js

      - name: Commit updated prices
        run: |
          git config user.name "fulltank-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json history.json
          git diff --cached --quiet && echo "No price change — nothing to commit." || git commit -m "chore: daily fuel price update"
          git push
