name: daily-fuel-price-update

on:
  schedule:
    # 19:00 UTC = 12:00 AM PKT (Asia/Karachi, UTC+5)
    - cron: '0 19 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Fetch latest fuel prices
        run: node fetch-prices.js

      - name: Rebuild site (sanity check)
        run: node build.js

      - name: Run tests
        run: node test.js

      - name: Commit updated prices
        run: |
          git config user.name "fulltank-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.json history.json dist/
          git diff --cached --quiet && echo "No price change — nothing to commit." || git commit -m "chore: daily fuel price update"
          git push
